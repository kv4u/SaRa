<!DOCTYPE html>
<html>
<head><title>Generate SaRa PWA Icons</title></head>
<body style="background:#1a1a2e;color:white;font-family:sans-serif;padding:20px;">
<h2>Right-click each image and "Save Image As" to the public/ folder</h2>
<p>apple-touch-icon.png (180x180):</p>
<canvas id="c180" width="180" height="180"></canvas>
<p>pwa-192x192.png:</p>
<canvas id="c192" width="192" height="192"></canvas>
<p>pwa-512x512.png:</p>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function draw(id) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  const s = c.width;
  const r = s / 2;

  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#14b8a6');
  grad.addColorStop(1, '#06b6d4');

  const radius = s * 0.22;
  ctx.beginPath();
  ctx.moveTo(radius, 0);
  ctx.lineTo(s - radius, 0);
  ctx.quadraticCurveTo(s, 0, s, radius);
  ctx.lineTo(s, s - radius);
  ctx.quadraticCurveTo(s, s, s - radius, s);
  ctx.lineTo(radius, s);
  ctx.quadraticCurveTo(0, s, 0, s - radius);
  ctx.lineTo(0, radius);
  ctx.quadraticCurveTo(0, 0, radius, 0);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.fillStyle = 'white';
  ctx.font = `bold ${s * 0.5}px -apple-system, Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('S', r, r + s * 0.02);
}
draw('c180');
draw('c192');
draw('c512');
</script>
</body>
</html>
